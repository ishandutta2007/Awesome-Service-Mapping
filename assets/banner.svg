<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="40%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050814"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".95"/></linearGradient><filter id="glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="4"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulse-subtle{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes dash-flow{0%{stroke-dashoffset:120}}@keyframes float-left{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(-1deg)}}@keyframes float-right{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes packet-travel{0%{offset-distance:0;opacity:0}15%,85%{opacity:1}}.bg-grid{stroke:#334155;stroke-width:.6;stroke-opacity:.22}.topo-line{stroke-dasharray:6 6;animation:dash-flow 18s linear infinite}.node-pulse{animation:pulse-subtle 4s ease-in-out infinite;transform-origin:center}.float-card-l{animation:float-left 6s ease-in-out infinite}.float-card-r{animation:float-right 7s ease-in-out infinite}.title-text{font-weight:800;letter-spacing:-.5px}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;letter-spacing:.2px}.badge-text{font-weight:600;font-size:11px}</style><rect width="1200" height="420" fill="url(#bg-grad)" rx="16"/><g class="bg-grid"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="0" x2="1200" y1="350" y2="350"/><line x1="120" x2="120" y1="0" y2="420"/><line x1="240" x2="240" y1="0" y2="420"/><line x1="360" x2="360" y1="0" y2="420"/><line x1="480" x2="480" y1="0" y2="420"/><line x1="600" x2="600" y1="0" y2="420"/><line x1="720" x2="720" y1="0" y2="420"/><line x1="840" x2="840" y1="0" y2="420"/><line x1="960" x2="960" y1="0" y2="420"/><line x1="1080" x2="1080" y1="0" y2="420"/></g><circle cx="200" cy="110" r="140" fill="#38bdf8" filter="url(#soft-glow)" opacity=".08"/><circle cx="1020" cy="310" r="160" fill="#818cf8" filter="url(#soft-glow)" opacity=".09"/><circle cx="600" cy="210" r="210" fill="#a855f7" filter="url(#soft-glow)" opacity=".06"/><g class="topo-line" opacity=".45"><path fill="none" stroke="#38bdf8" stroke-width="1.8" d="M 60 90 L 160 170 L 110 320 L 250 360"/><path fill="none" stroke="#818cf8" stroke-width="1.5" d="M 160 170 L 290 120 L 320 250"/><path fill="none" stroke="#c084fc" stroke-width="1.8" d="M 1140 100 L 1030 180 L 1090 320 L 950 360"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 1030 180 L 890 130 L 870 260"/><path fill="none" stroke="#0ea5e9" stroke-width="1.2" d="M 320 60 Q 600 20 880 60" opacity=".3"/></g><g class="float-card-l" transform="translate(60, 60)"><rect width="130" height="48" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)" rx="10"/><circle cx="24" cy="24" r="6" fill="#38bdf8" class="node-pulse"/><text x="38" y="22" fill="#f8fafc" class="badge-text" font-size="12">API Gateway</text><text x="38" y="36" fill="#94a3b8" class="badge-t