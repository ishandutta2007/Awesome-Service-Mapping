<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse-subtle {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes dash-flow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes float-left {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-1deg); }
    }
    @keyframes float-right {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes packet-travel {
      0% { offset-distance: 0%; opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    .bg-grid {
      stroke: #334155;
      stroke-width: 0.6;
      stroke-opacity: 0.22;
    }
    .topo-line {
      stroke-dasharray: 6 6;
      animation: dash-flow 18s linear infinite;
    }
    .node-pulse {
      animation: pulse-subtle 4s ease-in-out infinite;
      transform-origin: center;
    }
    .float-card-l {
      animation: float-left 6s ease-in-out infinite;
    }
    .float-card-r {
      animation: float-right 7s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
    }
  </style>

  <!-- Deep Canvas Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Blueprint Tech Grid in Background -->
  <g class="bg-grid">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="120" y1="0" x2="120" y2="420"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="360" y1="0" x2="360" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="840" y1="0" x2="840" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
    <line x1="1080" y1="0" x2="1080" y2="420"/>
  </g>

  <!-- Ambient Light Orbs (Background layer) -->
  <circle cx="200" cy="110" r="140" fill="#38bdf8" opacity="0.08" filter="url(#soft-glow)"/>
  <circle cx="1020" cy="310" r="160" fill="#818cf8" opacity="0.09" filter="url(#soft-glow)"/>
  <circle cx="600" cy="210" r="210" fill="#a855f7" opacity="0.06" filter="url(#soft-glow)"/>

  <!-- Dynamic Animated Topology Connection Lines (Peripheral Area) -->
  <g class="topo-line" opacity="0.45">
    <!-- Left constellation -->
    <path d="M 60 90 L 160 170 L 110 320 L 250 360" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <path d="M 160 170 L 290 120 L 320 250" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Right constellation -->
    <path d="M 1140 100 L 1030 180 L 1090 320 L 950 360" fill="none" stroke="#c084fc" stroke-width="1.8"/>
    <path d="M 1030 180 L 890 130 L 870 260" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Gentle outer curve bridging across top perimeter without touching center -->
    <path d="M 320 60 Q 600 20 880 60" fill="none" stroke="#0ea5e9" stroke-width="1.2" opacity="0.3"/>
  </g>

  <!-- Dynamic Glowing Peripheral Service Nodes & Cards -->
  <!-- Left Peripheral Floating Card 1: API Gateway -->
  <g class="float-card-l" transform="translate(60, 60)">
    <rect width="130" height="48" rx="10" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="24" cy="24" r="6" fill="#38bdf8" class="node-pulse"/>
    <text x="38" y="22" fill="#f8fafc" class="badge-text" font-size="12">API Gateway</text>
    <text x="38" y="36" fill="#94a3b8" class="badge-text" font-size="9">Latency: 2ms • 99.9%</text>
  </g>

  <!-- Left Peripheral Floating Card 2: Microservice Cluster -->
  <g class="float-card-l" transform="translate(80, 280)">
    <rect width="140" height="48" rx="10" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="6" fill="#818cf8" class="node-pulse"/>
    <text x="38" y="22" fill="#f8fafc" class="badge-text" font-size="12">Auth &amp; Session CI</text>
    <text x="38" y="36" fill="#94a3b8" class="badge-text" font-size="9">Topology: 4 Upstream</text>
  </g>

  <!-- Right Peripheral Floating Card 1: Cloud Mesh -->
  <g class="float-card-r" transform="translate(980, 70)">
    <rect width="145" height="48" rx="10" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="24" cy="24" r="6" fill="#c084fc" class="node-pulse"/>
    <text x="38" y="22" fill="#f8fafc" class="badge-text" font-size="12">Service Mesh</text>
    <text x="38" y="36" fill="#94a3b8" class="badge-text" font-size="9">Istio / eBPF Flow</text>
  </g>

  <!-- Right Peripheral Floating Card 2: CMDB Graph -->
  <g class="float-card-r" transform="translate(960, 290)">
    <rect width="155" height="48" rx="10" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.2"/>
    <circle cx="24" cy="24" r="6" fill="#34d399" class="node-pulse"/>
    <text x="38" y="22" fill="#f8fafc" class="badge-text" font-size="12">CMDB Graph DB</text>
    <text x="38" y="36" fill="#94a3b8" class="badge-text" font-size="9">Impact Analysis Ready</text>
  </g>

  <!-- Node Junction Dots -->
  <circle cx="160" cy="170" r="5" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="290" cy="120" r="4" fill="#818cf8"/>
  <circle cx="320" cy="250" r="4.5" fill="#34d399"/>
  <circle cx="1030" cy="180" r="5" fill="#c084fc" filter="url(#glow)"/>
  <circle cx="890" cy="130" r="4" fill="#38bdf8"/>
  <circle cx="870" cy="260" r="4.5" fill="#fbbf24"/>

  <!-- ========================================================================= -->
  <!-- FOREGROUND HERO CONTAINER: Guarantees title & subtitle remain 100% visible -->
  <!-- ========================================================================= -->
  <g transform="translate(600, 205)">
    <!-- Central Shield / Backdrop with Glassmorphism for Maximum Text Contrast -->
    <rect x="-350" y="-140" width="700" height="270" rx="20"
          fill="#090d16" fill-opacity="0.88"
          stroke="#1e293b" stroke-width="1.4"
          filter="url(#glow)"/>

    <!-- Subtle Inner Border Highlight -->
    <rect x="-348" y="-138" width="696" height="266" rx="18"
          fill="none" stroke="url(#primary-glow)" stroke-width="1" stroke-opacity="0.3"/>

    <!-- Decorative Category Pill -->
    <rect x="-140" y="-115" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="0" y="-97" text-anchor="middle" fill="#a5b4fc" class="badge-text" font-size="11" letter-spacing="1">
      ENTERPRISE ARCHITECTURE &amp; DEVOPS
    </text>

    <!-- Main Title -->
    <text x="0" y="-35" text-anchor="middle" fill="url(#primary-glow)" class="title-text" font-size="44" filter="url(#soft-glow)">
      Awesome Service Mapping
    </text>
    <text x="0" y="-35" text-anchor="middle" fill="#ffffff" class="title-text" font-size="44">
      Awesome Service Mapping
    </text>

    <!-- Subtitle -->
    <text x="0" y="15" text-anchor="middle" fill="#e2e8f0" class="subtitle-text" font-size="16">
      Application Dependency Mapping • CMDB Topology • Service Impact Analysis
    </text>

    <!-- Detailed Tech Sub-line -->
    <text x="0" y="44" text-anchor="middle" fill="#94a3b8" class="subtitle-text" font-size="13">
      Curated Catalog of SaaS Platforms, Open-Source CMDBs &amp; Distributed Observability Graphs
    </text>

    <!-- Interactive / Status Badges Row in Foreground -->
    <g transform="translate(0, 85)">
      <!-- Pill 1: Automated Discovery -->
      <g transform="translate(-190, 0)">
        <rect x="-65" y="-14" width="130" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="0.9"/>
        <text x="0" y="3.5" text-anchor="middle" fill="#38bdf8" class="badge-text">⚡ Auto-Discovery</text>
      </g>
      <!-- Pill 2: CMDB Graph -->
      <g transform="translate(-60, 0)">
        <rect x="-55" y="-14" width="110" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="0.9"/>
        <text x="0" y="3.5" text-anchor="middle" fill="#818cf8" class="badge-text">📊 CMDB Graphs</text>
      </g>
      <!-- Pill 3: Impact Analysis -->
      <g transform="translate(65, 0)">
        <rect x="-60" y="-14" width="120" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-width="0.9"/>
        <text x="0" y="3.5" text-anchor="middle" fill="#c084fc" class="badge-text">🎯 Impact Analysis</text>
      </g>
      <!-- Pill 4: Open-Source First -->
      <g transform="translate(190, 0)">
        <rect x="-55" y="-14" width="110" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-width="0.9"/>
        <text x="0" y="3.5" text-anchor="middle" fill="#34d399" class="badge-text">🌱 Open Source</text>
      </g>
    </g>
  </g>
</svg>
